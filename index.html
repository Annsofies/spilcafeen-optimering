<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ida Marie, Bex, Marie Luise & Sofie" />
    <meta name="description" content="Project Template" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="img/favicon.ico" />

    <title>Spiloversigt</title>
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-logo">Spilcaféen</div>

      <button class="book-btn" type="button">Book Bord</button>

      <button class="menu-btn" type="button" aria-label="Åbn menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <main>
      <!-- Søg -->
      <section class="intro">
        <div class="intro-logo">
          <img src="img/logo.png" alt="Spilcaféen" />
        </div>

        <h1>Spiloversigt</h1>

        <p>
          Vores fulde samling af brætspil – søg efter et bestemt spil, eller
          filtrer på café, antal spillere og spilletid.
        </p>
      </section>
      <div class="searchbar-container">
        <label for="search-input" class="visually-hidden">Søg efter spil</label>

        <div class="search-wrapper">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="search-input"
            type="search"
            placeholder="Søg efter et bestemt spil..."
          />
        </div>
      </div>

      <!-- Filtre -->
      <section class="filterbar" aria-label="Filtrér spil">
        <!-- Café -->
        <div class="filter-group">
          <label for="cafe-select" class="visually-hidden"> Vælg café </label>
          <select id="cafe-select">
            <option value="all">Alle caféer</option>
          </select>
        </div>

        <!-- Antal spillere -->
        <div class="filter-group">
          <label for="players-select" class="visually-hidden">
            Antal spillere
          </label>
          <select id="players-select"></select>
        </div>

        <!-- Genre -->
        <div class="filter-group">
          <label for="genre-select1" class="visually-hidden"> Genrer </label>
          <select id="genre-select1"></select>
        </div>

        <!-- Tid -->
        <div class="filter-group">
          <label for="genre-select2" class="visually-hidden"> Tid </label>
          <select id="genre-select2"></select>
        </div>

        <!-- Ryd filter -->
        <button id="clear-filters" class="clear-btn" type="button">
          <span aria-hidden="true">↻</span>
          <span>Ryd filter</span>
        </button>
      </section>

      <div class="sort-container">
        <label for="sort-select">Sorter efter:</label>

        <select id="sort-select">
          <option value="popular">Mest populær</option>
          <option value="az">A-Å</option>
          <option value="za">Å-A</option>
        </select>
      </div>

      <!-- Spil -->
      <section id="game-list" aria-label="Spil">
        <!-- Genereres med JavaScript -->
      </section>
    </main>

    <footer>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="#">Kontakt</a>
        <a href="#">Konkurrence</a>
        <a href="#">Bookinginfo</a>
      </nav>

      <div class="footer-socials">
        <span>TikTok</span>
        <span>Instagram</span>
        <span>Facebook</span>
      </div>
    </footer>

    <!-- Åbnet spil -->
    <dialog id="game-dialog">
      <button
        id="close-dialog"
        type="button"
        aria-label="Luk spil"
        onclick="document.getElementById('game-dialog').close()"
      >
        <span>Luk</span>
        <span class="close-icon" aria-hidden="true">×</span>
      </button>

      <div id="dialog-content"></div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
